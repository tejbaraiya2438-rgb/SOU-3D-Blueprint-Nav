<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOU 3D-DISHA </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Search Bar Container -->
  <div id="search-container">
    <input type="text" id="searchInput" placeholder="Search room (e.g. 803, 620, Aviation)..." />
  </div>

  <!-- 3D Canvas Rendering Area -->
  <div id="canvas-container"></div>

  <!-- Room Details Modal Overlay -->
  <div id="roomModal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="closeModalBtn" class="close-btn">&times;</button>

      <div id="modalImageContainer" class="image-wrapper hidden">
        <img id="roomImage" src="" alt="Room Image" />
      </div>

      <div id="modalDetails" class="room-details-content">
        <!-- Dynamic Room Info & Perspective Data Output -->
      </div>
    </div>
  </div>

  <!-- External Libraries & Main Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="script.js"></script>

</body>
</html>
